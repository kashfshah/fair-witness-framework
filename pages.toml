# Cloudflare Pages Configuration for Fair Witness Bot
# This configuration sets up the build process and deployment settings

[build]
  # The command to build the site
  command = "npm run build"
  
  # The directory containing the built site (Astro default)
  publish = "dist"
  
  # Node.js version to use for build
  node_version = "18"

[build.environment]
  # Astro environment settings
  ASTRO_TELEMETRY_DISABLED = "1"
  
  # Production environment indicators
  NODE_ENV = "production"
  
  # Add your API keys as environment variables here
  # OPENAI_API_KEY = ""
  # ANTHROPIC_API_KEY = ""

# Build caching settings
[build.caching]
  # Cache the node_modules directory
  [build.caching.node_modules]
    path = "node_modules"
    fingerprint_key = "npm"
    
  # Cache the build output
  [build.caching.build]
    path = "dist"
    fingerprint_key = "astro-build"

# Page rules and redirects
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
  [redirects.headers]
    Cache-Control = "public, max-age=3600"

# Custom headers for security and caching
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'"

# Cache static assets with longer expiration
[[headers]]
  for = "/*.{js,css,png,jpg,jpeg,svg,gif,webp,woff,woff2,ttf,eot}"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Advanced build settings
[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.html]
  pretty_urls = true

[build.processing.images]
  compress = true

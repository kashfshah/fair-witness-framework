<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180" fill="none">
  <!-- Background circle with gradient fill -->
  <circle cx="90" cy="90" r="85" fill="url(#gradient)" />
  
  <!-- Fair Witness symbol with thicker strokes for better visibility -->
  <g stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="90" cy="90" r="65" fill="none" />
    <path d="M90 25a33.75 33.75 0 0 0 0 67.5 33.75 33.75 0 0 1 0 67.5 33.75 33.75 0 0 0 0-67.5 33.75 33.75 0 0 1 0-67.5" />
    <line x1="90" y1="65" x2="90" y2="90" />
    <line x1="90" y1="115" x2="90" y2="115" />
  </g>
  
  <!-- Define gradient background -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a3c5b" />
      <stop offset="100%" stop-color="#2a5c8b" />
    </linearGradient>
  </defs>
</svg>
